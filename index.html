<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#d9ead8" />
    <meta name="description" content="Vampire Ducks 2.0 — collect garlic in a rich low-poly world." />
    <title>Vampire Ducks 2.0</title>
  </head>
  <body>
    <main id="app" aria-label="Vampire Ducks 2.0">
      <canvas id="game-canvas" aria-label="3D game view"></canvas>
      <div class="drag-origin" id="drag-origin" aria-hidden="true" hidden></div>
      <output class="mushroom-counter" id="mushroom-counter" aria-label="Garlic collected" aria-live="polite">
        <svg aria-hidden="true" viewBox="0 0 32 32">
          <path class="mushroom-cap" d="M4 15.5C4 8.6 9.4 4 16 4s12 4.6 12 11.5c0 1.4-1.1 2.5-2.5 2.5h-19A2.5 2.5 0 0 1 4 15.5Z" />
          <path class="mushroom-stem" d="M12.5 17h7v6.5c0 2.5-1.5 4.5-3.5 4.5s-3.5-2-3.5-4.5V17Z" />
          <circle cx="11" cy="10" r="1.6" /><circle cx="20.5" cy="12.5" r="1.4" />
        </svg>
        <span id="mushroom-count">0</span>
      </output>
      <!-- NOTE: Full UI panels are provided by the upstream Mobile Walker index; this title branding is for Vampire Ducks 2.0. Deploy uses the full HTML from the fork. -->
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
