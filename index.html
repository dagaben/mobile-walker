<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#d9ead8" />
    <meta name="description" content="Vampire Ducks 2.0 — collect garlic by day, survive rubber vampire ducks at night." />
    <title>Vampire Ducks 2.0</title>
  </head>
  <body>
    <main id="app" aria-label="Vampire Ducks 2.0">
      <canvas id="game-canvas" aria-label="3D game view"></canvas>
      <div class="drag-origin" id="drag-origin" aria-hidden="true" hidden></div>
      <div class="vd-hud" id="vd-hud" aria-label="Game status">
        <div class="vd-hud-chip" id="score-chip" title="Score">⭐ <span id="score-count">0</span></div>
        <div class="vd-hud-chip" id="lives-chip" title="Lives">❤️ <span id="lives-count">5</span></div>
        <div class="vd-hud-chip vd-hud-icon" id="time-chip" title="Day / Night" aria-label="Day">☀️</div>
        <output class="garlic-counter" id="mushroom-counter" aria-label="Garlic collected" aria-live="polite">
          <span class="garlic-icon" aria-hidden="true">🧄</span>
          <span id="mushroom-count">0</span>
          <span id="garlic-count" hidden>0</span>
        </output>
      </div>
      <div class="toolbar">
        <button class="toolbar-button" id="pause-button" type="button" aria-label="Pause game" aria-pressed="false" title="Pause">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg>
        </button>
        <button class="toolbar-button" id="mute-button" type="button" aria-label="Mute sound" aria-pressed="false" title="Mute">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4.5 3.5a5 5 0 0 1 0 7M16 8.5a7 7 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="toolbar-button" id="debug-button" type="button" aria-label="Toggle debug tools" aria-controls="debug-panel" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 3h6M10 3v3m4-3v3m-7 5H4m16 0h-3M7 15H4m16 0h-3M8 8h8l1 3v5a5 5 0 0 1-10 0v-5l1-3Z" /></svg>
        </button>
        <button class="toolbar-button" id="settings-button" type="button" aria-label="Toggle settings" aria-controls="settings-panel" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63h.01A1.7 1.7 0 0 0 10 3.08V3h4v.08a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9v.01A1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z" /></svg>
        </button>
      </div>
