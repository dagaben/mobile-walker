name: Apply audio and economy
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble scripts
        run: |
          cat scripts/apply-audio-rest.sh.a scripts/apply-audio-rest.sh.b > scripts/apply-audio-rest.sh
          cat scripts/apply-audio-wire-a.sh.a scripts/apply-audio-wire-a.sh.b > scripts/apply-audio-wire-a.sh
          cat scripts/apply-audio-wire-b.sh.a scripts/apply-audio-wire-b.sh.b > scripts/apply-audio-wire-b.sh
          chmod +x scripts/apply-audio-rest.sh scripts/apply-audio-wire-a.sh scripts/apply-audio-wire-b.sh
      - name: Write files
        run: |
          bash scripts/apply-audio-rest.sh
          bash scripts/apply-audio-wire-a.sh
          bash scripts/apply-audio-wire-b.sh
      - name: Typecheck and test
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run src/game/difficulty.test.ts src/game/audio.test.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game src/core index.html
          git commit -m "Day/night audio + tighter garlic economy" || echo none
          git push
