name: Apply flying ducks + landscape
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/ducks_a.txt
      - scripts/ducks_b.txt
      - scripts/assemble-ducks.sh
      - scripts/landscape.css
      - scripts/patch-landscape-main.py
      - .github/workflows/apply-flying-ducks.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble ducks + landscape
        run: |
          bash scripts/assemble-ducks.sh
          if ! grep -q "orientation: landscape" src/style.css; then
            cat scripts/landscape.css >> src/style.css
            echo "appended landscape CSS"
          fi
          if ! grep -q "requestLandscape" src/main.ts; then
            python3 scripts/patch-landscape-main.py
            echo "patched main.ts"
          fi
      - name: Typecheck & build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/game/ducks.ts src/style.css src/main.ts || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Vampire flying ducks (cape, fangs, flapping wings, hover) + landscape orientation"
            git push
          fi
