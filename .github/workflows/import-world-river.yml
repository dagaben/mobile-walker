name: Import world river modules
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and patch
        run: bash scripts/import-world-river.sh
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Import world river landscape from upstream + VD compatibility"
            git push
          fi
